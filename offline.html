<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta name="theme-color" content="#2b2d31"><title>Offline · JIMERICA</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:dark;--bg:#2b2d31;--gold:#f0c674;--muted:#b5bac1}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#f2f3f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}.brand{font-weight:800;letter-spacing:.16em;color:var(--gold);font-size:.85rem}h1{font-size:1.6rem;margin:14px 0 10px}p{color:var(--muted);max-width:420px;margin:0 auto 22px;line-height:1.6}button{font:inherit;font-weight:600;color:var(--gold);background:transparent;border:1px solid rgba(240,198,116,.5);border-radius:999px;padding:10px 20px;cursor:pointer}</style></head>
<body><main><div class="brand">@JIMERICA</div><h1 id="t">You're offline</h1><p id="p">JIMERICA shows live Spotify stats, so it needs an internet connection. Reconnect and try again.</p><button id="b" type="button">Try again</button></main>
<script>
var D={ko:["오프라인 상태입니다","JIMERICA는 최신 Spotify 통계를 보여주므로 인터넷 연결이 필요합니다. 연결 후 다시 시도해 주세요.","다시 시도"],es:["Sin conexión","JIMERICA muestra estadísticas de Spotify en directo, así que necesita conexión a internet. Vuelve a conectarte e inténtalo de nuevo.","Reintentar"]};
try{var l=localStorage.getItem('jimerica-lang');if(D[l]){document.documentElement.lang=l;document.getElementById('t').textContent=D[l][0];document.getElementById('p').textContent=D[l][1];document.getElementById('b').textContent=D[l][2];}}catch(e){}
document.getElementById('b').onclick=function(){location.href='./';};
</script></body></html>
